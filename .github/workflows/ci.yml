name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run install:all
      - run: npm test
      - run: npm run build
